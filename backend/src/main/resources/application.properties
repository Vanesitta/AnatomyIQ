# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anatomyiq_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Schema & Data Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.error.include-message=always

# JWT Security Settings (Secret must be loaded from an environment variable with a development fallback)
jwt.secret=${JWT_SECRET:default_development_secret_key_must_be_at_least_256_bits_long_for_hs256_to_work_properly_with_jjwt}
jwt.expiration=${JWT_EXPIRATION:86400000}
