version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: anatomyiq-db
    environment:
      POSTGRES_DB: anatomyiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anatomyiq-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/anatomyiq_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: "7y9B_mK_w2p_8vQs_Z4xNcV_u_b1n6mR"
      JWT_EXPIRATION: "86400000"
    depends_on:
      - db

volumes:
  pgdata:
