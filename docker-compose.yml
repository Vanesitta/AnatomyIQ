version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: anatomyiq-db
    environment:
      POSTGRES_DB: anatomyiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anatomyiq-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env

    depends_on:
      - db

volumes:
  pgdata:
